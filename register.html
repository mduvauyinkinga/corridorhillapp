<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register for Corridor Hill Residence Maintenance System." />
  <meta name="theme-color" content="#143c5c" />
  <title>Register | Corridor Hill</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/jpeg" href="assets/images/corridor-logo.jpeg" />
  <link rel="apple-touch-icon" href="assets/images/corridor-logo.jpeg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card__brand">
        <div class="auth-logo" aria-hidden="true">
          <img src="assets/images/corridor-logo.jpeg" alt="" width="72" height="72" />
        </div>
        <h1>Corridor Hill Residence</h1>
        <p>Create your resident account</p>
      </div>

      <form id="register-form" class="form" novalidate>
        <div id="form-alert" class="form__alert" role="alert" hidden></div>

        <div class="form__group">
          <label class="form__label" for="full-name">Full Name <span class="form__required">*</span></label>
          <input
            class="form__input"
            type="text"
            id="full-name"
            name="fullName"
            autocomplete="name"
            placeholder="e.g. Mzimba Mahlangu"
            required
          />
          <p class="form__error" data-error="fullName" role="alert"></p>
        </div>

        <div class="form__group">
          <label class="form__label" for="student-number">Student Number <span class="form__required">*</span></label>
          <input
            class="form__input"
            type="text"
            id="student-number"
            name="studentNumber"
            autocomplete="off"
            placeholder="e.g. 223456789"
            required
          />
          <p class="form__error" data-error="studentNumber" role="alert"></p>
        </div>

        <div class="form__group">
          <label class="form__label" for="email">Email <span class="form__required">*</span></label>
          <input
            class="form__input"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@tut4life.ac.za"
            required
          />
          <p class="form__error" data-error="email" role="alert"></p>
          <span class="domain-hint">Must end with @tut4life.ac.za</span>
        </div>

        <div class="form__group">
          <label class="form__label" for="password">Password <span class="form__required">*</span></label>
          <input
            class="form__input"
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            placeholder="At least 6 characters"
            minlength="6"
            required
          />
          <p class="form__error" data-error="password" role="alert"></p>
        </div>

        <div class="form__group">
          <label class="form__label" for="confirm-password">Confirm Password <span class="form__required">*</span></label>
          <input
            class="form__input"
            type="password"
            id="confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            placeholder="Re-enter your password"
            minlength="6"
            required
          />
          <p class="form__error" data-error="confirmPassword" role="alert"></p>
        </div>

        <div class="form__actions">
          <button id="register-btn" type="submit" class="btn btn--primary btn--block">
            Create Account
          </button>
        </div>

        <p class="form__switch">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </form>
    </div>
  </main>

  <script type="module" src="js/register.js"></script>
</body>
</html>
